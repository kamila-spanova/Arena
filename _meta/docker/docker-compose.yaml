services:
  arena:
    image: "${ARENA_IMAGE}"
    pull_policy: "never"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/docker/Dockerfile
      args:
        - gid=${HOST_GID}
        - uid=${HOST_UID}
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
      - "$HOST_ARENA_DATA_DIR:/opt/arena_ws/data"
      # - "${XDG_RUNTIME_DIR}/pulse/native:/tmp/pulse/native:ro"
    environment:
      - QT_X11_NO_MITSHM=1
      - TMPDIR=/tmp/shared
      - DISPLAY
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_IMAGE_TAG
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_GID
      - HOST_ARENA_WS_DIR
      - HOST_ARENA_DATA_DIR
      - ARENA_DATA_DIR=/opt/arena_ws/data
      - ROSNAV_AGENTS_DIR=/opt/arena_ws/data/agents
      - LLM_API_ENDPOINT
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - CYCLONEDDS_URI=file:///opt/arena_ws/src/Arena/_meta/docker/cyclonedds.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/arena_ws/src/Arena/_meta/docker/fastdds.xml
      # - PULSE_SERVER=unix:/tmp/pulse/native
      - XDG_RUNTIME_DIR=/tmp/pulse
    env_file:
      - "$HOST_ARENA_WS_DIR/.env"
    user: "${HOST_UID}"
    group_add:
      - sudo
      - audio
    network_mode: host
    command: ["bash"]
    stdin_open: true 
    tty: true
    healthcheck:
      test: ["CMD", "test", "-f", "/.built"]
      interval: 1s
      timeout: 2s
      retries: 99999 # if you can't build by then, good juck
      start_period: 0s
    ports:
      - 50101
      - 50102

volumes:
  shared:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
